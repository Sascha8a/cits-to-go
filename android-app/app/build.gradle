plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'org.opentrafficmap.citstogo'
    compileSdk = 35

    def releaseStoreFile = System.getenv('CITS_RELEASE_STORE_FILE')
    def releaseStorePassword = System.getenv('CITS_RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('CITS_RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('CITS_RELEASE_KEY_PASSWORD')
    def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    defaultConfig {
        applicationId = 'org.opentrafficmap.citstogo'
        minSdk = 26
        targetSdk = 35
        versionCode = 76
        versionName = '2.37.1'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    lint {
        disable('NullSafeMutableLiveData')
    }

    kotlin {
        jvmToolchain(17)
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui:1.11.1'
    implementation 'androidx.compose.foundation:foundation:1.11.1'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
